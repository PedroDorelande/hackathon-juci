{% extends 'base.html' %}
{% block title %}{{ acao }} Pessoa{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h1><i class="fas fa-{{ 'user-plus' if acao == 'Cadastrar' else 'user-edit' }}"></i> {{ acao }} Pessoa</h1>
        <p class="subtitle">Preencha os campos obrigatorios (*). Digite o CEP para preencher automaticamente!</p>
    </div>
    <a href="/" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Voltar</a>
</div>

<div class="card">
    <form method="POST" class="form-grid">
        <div class="form-group full-width">
            <label for="nome"><i class="fas fa-user"></i> Nome Completo *</label>
            <input type="text" id="nome" name="nome" value="{{ pessoa.nome|default('') }}" required placeholder="Ex: Joao da Silva">
        </div>
        <div class="form-group">
            <label for="cpf"><i class="fas fa-id-card"></i> CPF *</label>
            <input type="text" id="cpf" name="cpf" value="{{ pessoa.cpf|default('') }}" required placeholder="000.000.000-00" maxlength="14">
        </div>
        <div class="form-group">
            <label for="telefone"><i class="fas fa-phone"></i> Telefone *</label>
            <input type="text" id="telefone" name="telefone" value="{{ pessoa.telefone|default('') }}" required placeholder="(00) 00000-0000" maxlength="15">
        </div>
        <div class="form-group">
            <label for="cep"><i class="fas fa-envelope"></i> CEP <span class="cep-hint">(preenche endereco automatico)</span></label>
            <div class="cep-wrapper">
                <input type="text" id="cep" name="cep" value="{{ pessoa.cep|default('') }}" placeholder="00000-000" maxlength="9">
                <span id="cep-status"></span>
            </div>
        </div>
        <div class="form-group">
            <label for="endereco"><i class="fas fa-map-marker-alt"></i> Endereco *</label>
            <input type="text" id="endereco" name="endereco" value="{{ pessoa.endereco|default('') }}" required placeholder="Rua, numero, bairro">
        </div>
        <div class="form-group">
            <label for="cidade"><i class="fas fa-city"></i> Cidade</label>
            <input type="text" id="cidade" name="cidade" value="{{ pessoa.cidade|default('') }}" placeholder="Ex: Sao Paulo">
        </div>
        <div class="form-group">
            <label for="estado"><i class="fas fa-map"></i> Estado</label>
            <select id="estado" name="estado">
                <option value="">Selecione...</option>
                {% set estados = ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'] %}
                {% for uf in estados %}
                <option value="{{ uf }}" {{ 'selected' if pessoa.estado|default('') == uf }}>{{ uf }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-actions full-width">
            <button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-save"></i> {{ acao }}</button>
            <a href="/" class="btn btn-secondary btn-lg"><i class="fas fa-times"></i> Cancelar</a>
        </div>
    </form>
</div>

<script>
// Mascaras
document.getElementById('cpf').addEventListener('input', function(e) {
    let v = e.target.value.replace(/\D/g, '').slice(0, 11);
    v = v.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
    e.target.value = v;
});
document.getElementById('telefone').addEventListener('input', function(e) {
    let v = e.target.value.replace(/\D/g, '').slice(0, 11);
    v = v.replace(/(\d{2})(\d)/, '($1) $2').replace(/(\d{5})(\d)/, '$1-$2');
    e.target.value = v;
});
document.getElementById('cep').addEventListener('input', function(e) {
    let v = e.target.value.replace(/\D/g, '').slice(0, 8);
    v = v.replace(/(\d{5})(\d)/, '$1-$2');
    e.target.value = v;
});

// ViaCEP - busca endereco automatico
document.getElementById('cep').addEventListener('blur', function() {
    const cep = this.value.replace(/\D/g, '');
    const status = document.getElementById('cep-status');
    if (cep.length === 8) {
        status.textContent = 'Buscando...';
        status.className = 'loading';
        fetch('https://viacep.com.br/ws/' + cep + '/json/')
            .then(r => r.json())
            .then(data => {
                if (!data.erro) {
                    document.getElementById('endereco').value = data.logradouro + (data.bairro ? ', ' + data.bairro : '');
                    document.getElementById('cidade').value = data.localidade;
                    document.getElementById('estado').value = data.uf;
                    status.textContent = 'Preenchido!';
                    status.className = 'ok';
                    // Highlight fields
                    ['endereco','cidade','estado'].forEach(id => {
                        const el = document.getElementById(id);
                        el.style.borderColor = '#00b894';
                        setTimeout(() => el.style.borderColor = '', 1500);
                    });
                } else {
                    status.textContent = 'CEP nao encontrado';
                    status.className = 'err';
                }
            })
            .catch(() => { status.textContent = 'Erro na busca'; status.className = 'err'; });
        setTimeout(() => { status.textContent = ''; }, 3000);
    }
});
</script>
{% endblock %}
